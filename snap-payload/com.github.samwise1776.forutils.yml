app-id: com.github.samwise1776.fortranomni
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fortranomni
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
modules:
  - name: fortranomni
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/fortranomni
      - cp -a . /app/share/fortranomni/
      - install -Dm755 run.sh /app/bin/fortranomni
    sources:
      - type: dir
        path: .
